<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Infer — AI Research Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#111;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  #out{width:min(100vw,100vh);height:min(100vw,100vh);display:block}
</style>
</head>
<body>
<canvas id="out" width="1440" height="1440"></canvas>
<script>
/* =====================================================================
   Infer — a 30 s launch film for an AI research club.
   One continuous take, 1440 x 1440, 120 BPM, 60 beats.
   Every pixel is a pure function of time: await seek(t) draws frame t.
   No CSS transitions, no timers, no state carried between frames.
   ===================================================================== */
'use strict';
const W = 1440, C = 720, BPM = 120, DUR = 30;
const BG = '#F3F0EA', INK = '#0B0B0C';
const PI = Math.PI, TAU = PI * 2;
const B = b => (b - 1) * 0.5;                       // start time of beat b
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, t0, d) => clamp((t - t0) / d);
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eio5 = u => u < .5 ? 16 * u ** 5 : 1 - Math.pow(-2 * u + 2, 5) / 2;
const eo = u => 1 - Math.pow(1 - u, 3);
const ei = u => u * u * u;

/* ---------- springs: closed-form step responses ---------- */
function spr(t, f = 2.2, z = 0.72) {
  if (t <= 0) return 0;
  const w = TAU * f;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
/* a value with many targets = the sum of one spring per change */
function S(t, keys, f = 2.2, z = 0.72) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i];
    v += (k[1] - keys[i - 1][1]) * spr(t - k[0], k[2] ?? f, k[3] ?? z);
  }
  return v;
}
const bump = (t, t0, hold = 0.09, f = 5) => clamp(spr(t - t0, f, 1) - spr(t - t0 - hold, f * 0.8, 1));

/* ---------- canvases ---------- */
const out = document.getElementById('out');
const octx = out.getContext('2d');
const world = document.createElement('canvas'); world.width = world.height = W;
const wctx = world.getContext('2d');
const glc = document.createElement('canvas'); glc.width = glc.height = W;

/* ---------- assets ---------- */
const IMG = {};
const IMG_LIST = ['vr', 'robot', 'chip', 'team', 'gpu', 'code', 'math', 'crew', 'lock', 'hand', 'xr', 'day', 'golden'];
let wallVideo = null;
const FONT_SIZE_WM = 250;
const M = {};   // metrics

async function loadAll() {
  const faces = [];
  for (let w = 62; w <= 125; w++) faces.push(new FontFace('ArchW' + w, `url(fonts/arch/w${w}.woff2)`, { weight: '800' }));
  faces.push(new FontFace('Geist', 'url(fonts/geist-latin.woff2)', { weight: '100 900' }));
  faces.push(new FontFace('GeistMono', 'url(fonts/geistmono-latin.woff2)', { weight: '100 900' }));
  faces.push(new FontFace('Pret', 'url(fonts/pretendard.woff2)', { weight: '100 900' }));
  await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff))));
  await Promise.all(IMG_LIST.map(n => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(); im.onerror = rej; im.src = `img/${n}.jpg`; IMG[n] = im;
  })));
  await Promise.all(IMG_LIST.map(n => IMG[n].decode()));
  // footage: all-intra, loaded as a blob URL so every seek is exact
  const blob = await (await fetch('footage/wall.webm')).blob();
  wallVideo = document.createElement('video');
  wallVideo.muted = true; wallVideo.playsInline = true; wallVideo.preload = 'auto';
  wallVideo.src = URL.createObjectURL(blob);
  await new Promise((r, j) => { wallVideo.addEventListener('loadeddata', r, { once: true }); wallVideo.addEventListener('error', () => j(new Error('video ' + wallVideo.error?.code)), { once: true }); });
  measure();
  buildAtlas();
  initGL();
}

/* ---------- typography helpers ---------- */
const fA = (w, s) => `800 ${s}px ArchW${w}`;
const fG = (wt, s) => `${wt} ${s}px Geist, Pret`;
const fP = (wt, s) => `${wt} ${s}px Pret`;
const fM = (wt, s) => `${wt} ${s}px GeistMono`;

function measure() {
  const c = wctx;
  const word = 'Infer';
  M.adv = {}; M.sum = {};
  for (let w = 62; w <= 125; w++) {
    c.font = fA(w, FONT_SIZE_WM);
    M.adv[w] = [...word].map(ch => c.measureText(ch).width);
    M.sum[w] = M.adv[w].reduce((a, b) => a + b, 0);
  }
  c.font = fA(125, FONT_SIZE_WM);
  M.cap = c.measureText('I').actualBoundingBoxAscent;
  M.dotD = 0.19 * FONT_SIZE_WM;
  M.dotGap = 0.035 * FONT_SIZE_WM;
  const total = M.sum[125] + M.dotGap + M.dotD;
  M.x0 = C - total / 2;
  M.base = C + M.cap / 2;
  M.XD = M.x0 + M.sum[125] + M.dotGap;                 // the point every letter squeezes into
  M.dot = { x: M.XD + M.dotD / 2, y: M.base - M.dotD / 2 };
}

/* text that rises out of (or sinks into) its own mask line */
function maskText(c, str, x, y, font, color, align, vis, opts = {}) {
  // vis: 0 = below the line, 1 = seated, 2 = gone above
  if (vis <= 0.001 || vis >= 1.999) return;
  c.save();
  c.font = font; c.textAlign = align; c.textBaseline = 'alphabetic';
  const m = c.measureText(str);
  const asc = opts.asc ?? m.fontBoundingBoxAscent, desc = opts.desc ?? m.fontBoundingBoxDescent;
  const wd = m.width;
  const left = align === 'center' ? x - wd / 2 : align === 'right' ? x - wd : x;
  const h = asc + desc;
  c.beginPath(); c.rect(left - 8, y - asc - 2, wd + 16, h + 4); c.clip();
  const off = (1 - vis) * h;           // vis<1 → below, vis>1 → above
  if (opts.shadow) { c.shadowColor = opts.shadow; c.shadowBlur = opts.shadowBlur ?? 18; c.shadowOffsetY = 2; }
  c.fillStyle = color;
  c.fillText(str, x, y + off);
  c.restore();
}
/* visibility of a masked text: rises at tIn, leaves at tOut */
const vis = (t, tIn, tOut = 1e9, f = 2.6, z = 0.86) => clamp(spr(t - tIn, f, z), 0, 1.04) + clamp(spr(t - tOut, f * 1.1, 0.9), 0, 1);

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function cover(c, img, x, y, w, h, zoom = 1, fx = .5, fy = .5) {
  if (w <= 0 || h <= 0) return;
  const iw = img.videoWidth || img.width, ih = img.videoHeight || img.height;
  const ir = iw / ih, r = w / h;
  let sw, sh;
  if (ir > r) { sh = ih / zoom; sw = sh * r; } else { sw = iw / zoom; sh = sw / r; }
  const sx = clamp((iw - sw) * fx, 0, iw - sw), sy = clamp((ih - sh) * fy, 0, ih - sh);
  c.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
const FOCUS = { vr: [.52, .3], robot: [.45, .3], lock: [.42, .5], team: [.5, .4], crew: [.5, .4], math: [.4, .4], code: [.55, .5], gpu: [.5, .5], chip: [.5, .5], hand: [.5, .3], xr: [.55, .4], day: [.5, .5], golden: [.5, .5] };
const img = (c, n, x, y, w, h, zoom = 1) => cover(c, IMG[n], x, y, w, h, zoom, ...(FOCUS[n] || [.5, .5]));

/* ---------- glyph distance-field atlas for glass letters ---------- */
const ATLAS = { cell: 384, size: 256, glyphs: {} };
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
function edt(grid, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = grid[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = grid[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) grid[y * w + x] = d[x]; }
}
function buildAtlas() {
  const list = [...'Relight'.split('').map(ch => [ch, 112]), ...'9:41'.split('').map(ch => [ch, 100])];
  const uniq = []; const seen = new Set();
  for (const [ch, w] of list) { const key = ch + w; if (!seen.has(key)) { seen.add(key); uniq.push([ch, w]); } }
  const cols = 4, rows = Math.ceil(uniq.length / cols), cs = ATLAS.cell;
  const AW = cols * cs, AH = rows * cs;
  const data = new Float32Array(AW * AH);
  const cv = document.createElement('canvas'); cv.width = cv.height = cs;
  const c = cv.getContext('2d', { willReadFrequently: true });
  uniq.forEach(([ch, w], i) => {
    c.clearRect(0, 0, cs, cs);
    c.font = fA(w, ATLAS.size); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const capH = c.measureText('H').actualBoundingBoxAscent;
    const adv = c.measureText(ch).width;
    c.fillText(ch, cs / 2, cs / 2 + capH / 2);
    const px = c.getImageData(0, 0, cs, cs).data;
    const inside = new Float64Array(cs * cs), outside = new Float64Array(cs * cs);
    for (let p = 0; p < cs * cs; p++) { const a = px[p * 4 + 3] / 255; inside[p] = a > .5 ? 0 : 1e20; outside[p] = a > .5 ? 1e20 : 0; }
    edt(inside, cs, cs); edt(outside, cs, cs);
    const cx = (i % cols) * cs, cy = Math.floor(i / cols) * cs;
    for (let y = 0; y < cs; y++) for (let x = 0; x < cs; x++) {
      const p = y * cs + x;
      const dOut = Math.sqrt(inside[p]), dIn = Math.sqrt(outside[p]);
      const sd = dOut > 0 ? dOut - 0.5 : -(dIn - 0.5);
      data[(cy + y) * AW + cx + x] = sd;
    }
    ATLAS.glyphs[ch + w] = { u0: cx / AW, v0: cy / AH, u1: (cx + cs) / AW, v1: (cy + cs) / AH, adv, capH };
  });
  ATLAS.data = data; ATLAS.w = AW; ATLAS.h = AH;
}

/* ---------- liquid glass compositor (WebGL2) ----------
   Each glass group refracts a copy of the scene behind it: a rounded-rect / glyph
   distance field drives the displacement, sampled three times at slightly different
   scales for chromatic edges, plus a rim light. Groups of primitives are unioned with
   a smooth minimum, which is what makes them melt into each other (goo). */
let gl, prog_, U = {}, texScene, texAtlas;
const MAXP = 24;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uAtlas;
uniform vec2 uRes;
uniform int uN;
uniform vec4 uA[${MAXP}], uB[${MAXP}], uC[${MAXP}], uD[${MAXP}];
uniform vec4 uG[4], uGc[4], uGb[4];
uniform int uGroups;
out vec4 o;
float sdBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float smin(float a,float b,float k){ if(k<=0.) return min(a,b); float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*0.25; }
float primD(int i, vec2 p){
  vec4 A=uA[i], Bv=uB[i];
  vec2 q=p-A.xy;
  if(Bv.z<0.5) return sdBox(q, A.zw, min(Bv.x, min(A.z,A.w)));
  float db=sdBox(q, A.zw, 0.);
  vec2 uvl=clamp((q/A.zw)*0.5+0.5, 0., 1.);
  vec4 Cv=uC[i];
  float d=texture(uAtlas, mix(Cv.xy, Cv.zw, uvl)).r*uD[i].x;
  return db > 0. ? db + max(d, 0.) : d;
}
float groupD(int g, vec2 p){
  float d=1e5; bool first=true;
  for(int i=0;i<${MAXP};i++){
    if(i>=uN) break;
    if(int(uB[i].w+0.5)!=g) continue;
    float di=primD(i,p);
    d = first ? di : smin(d, di, uB[i].y);
    first=false;
  }
  return d;
}
vec3 scene(vec2 p){ return texture(uScene, clamp(p/uRes, vec2(0.), vec2(1.))).rgb; }
void main(){
  vec2 p=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  vec3 col=scene(p);
  for(int g=0; g<4; g++){
    if(g>=uGroups) break;
    vec4 G=uG[g], Gc=uGc[g], Gb=uGb[g];
    if(p.x<Gb.x||p.y<Gb.y||p.x>Gb.z||p.y>Gb.w) continue;
    float d=groupD(g,p);
    if(G.x>0.5){                       // solid (liquid black)
      col=mix(col, Gc.rgb, clamp(0.5-d,0.,1.)*Gc.a);
      continue;
    }
    if(d>0. && d<40.+G.w*2.){          // soft contact shadow
      float ds=groupD(g, p-vec2(0., G.w*0.6));
      col*=1.-(1.-smoothstep(0., 30.+G.w, ds))*0.20*step(0.001, G.w);
    }
    if(d<1.){
      float depth=max(-d,0.);
      float Bz=G.y;
      if(depth>Bz+2.){                  // flat interior: no refraction, just the tint
        vec3 gi=mix(col, Gc.rgb, Gc.a);
        col=gi; continue;
      }
      float e=1.;
      vec2 n=vec2(groupD(g,p+vec2(e,0))-groupD(g,p-vec2(e,0)), groupD(g,p+vec2(0,e))-groupD(g,p-vec2(0,e)));
      n=n/max(length(n),1e-4);
      float tt=clamp(depth/Bz,0.,1.);
      float m=G.z*Bz*pow(1.-tt,2.2);
      vec2 off=n*m;
      vec3 gcol=vec3(scene(p+off*0.90).r, scene(p+off).g, scene(p+off*1.12).b);
      gcol=mix(gcol, Gc.rgb, Gc.a);
      vec2 L=normalize(vec2(-0.55,-0.83));
      float lit=pow(max(dot(n,L),0.),1.6);
      float lit2=pow(max(dot(n,-L),0.),2.);
      float rim=1.-smoothstep(0.,2.6,depth);
      float band=1.-smoothstep(0.,Bz*0.9,depth);
      gcol+=rim*(0.75*lit+0.32*lit2);
      gcol+=band*(0.10*lit) - band*0.06*lit2;
      col=mix(col, gcol, clamp(0.5-d,0.,1.));
    }
  }
  o=vec4(col,1.);
}`;
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
function initGL() {
  gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  prog_ = gl.createProgram();
  gl.attachShader(prog_, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog_, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog_); if (!gl.getProgramParameter(prog_, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog_));
  gl.useProgram(prog_);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog_, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uScene', 'uAtlas', 'uRes', 'uN', 'uA', 'uB', 'uC', 'uD', 'uG', 'uGc', 'uGb', 'uGroups']) U[n] = gl.getUniformLocation(prog_, n);
  texScene = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  texAtlas = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texAtlas);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, ATLAS.w, ATLAS.h, 0, gl.RED, gl.FLOAT, ATLAS.data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uScene, 0); gl.uniform1i(U.uAtlas, 1); gl.uniform2f(U.uRes, W, W);
}

/* frame-local render lists (rebuilt from scratch on every seek) */
let PR, GR, TOP, CAM;
function glassGroup(opts) {          // returns group id
  const g = { material: opts.solid ? 1 : 0, bezel: opts.bezel ?? 26, refract: opts.refract ?? 0.9, shadow: opts.shadow ?? 14, color: opts.color ?? [1, 1, 1, 0.075] };
  GR.push(g); return GR.length - 1;
}
const toS = (x, y) => [(x - CAM.cx) * CAM.s + C, (y - CAM.cy) * CAM.s + C];
function pBox(g, cx, cy, hx, hy, r, k = 0) {          // world coords
  if (hx <= 0.5 || hy <= 0.5) return;
  const [sx, sy] = toS(cx, cy);
  PR.push({ g, a: [sx, sy, hx * CAM.s, hy * CAM.s], b: [r * CAM.s, k * CAM.s, 0, g], c: [0, 0, 0, 0], d: [1, 0, 0, 0] });
}
function pGlyph(g, key, ox, base, size, k = 0, scale = 1) {   // origin + baseline in world
  const G = ATLAS.glyphs[key]; if (!G || scale <= 0.01) return;
  const kk = size / ATLAS.size;
  const cx = ox + G.adv * kk / 2, cy = base - G.capH * kk / 2;
  const [sx, sy] = toS(cx, cy);
  const s = kk * scale * CAM.s;
  PR.push({ g, a: [sx, sy, ATLAS.cell / 2 * s, ATLAS.cell / 2 * s], b: [0, k * CAM.s, 1, g], c: [G.u0, G.v0, G.u1, G.v1], d: [s, 0, 0, 0] });
}
function glyphRun(key0, str, w, size) {      // layout helper for glass words
  const xs = []; let x = 0;
  for (const ch of str) { const G = ATLAS.glyphs[ch + w]; xs.push(x); x += G.adv * size / ATLAS.size; }
  return { xs, width: x };
}
function compositeGlass() {
  if (!PR.length) return false;
  // bounding box of everything glass, plus shadow margin
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of PR) { const m = p.b[1] + 70; x0 = Math.min(x0, p.a[0] - p.a[2] - m); x1 = Math.max(x1, p.a[0] + p.a[2] + m); y0 = Math.min(y0, p.a[1] - p.a[3] - m); y1 = Math.max(y1, p.a[1] + p.a[3] + m); }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(W, Math.ceil(y1));
  if (x1 <= x0 || y1 <= y0) return false;
  const n = Math.min(PR.length, MAXP);
  const A = new Float32Array(MAXP * 4), Bb = new Float32Array(MAXP * 4), Cc = new Float32Array(MAXP * 4), D = new Float32Array(MAXP * 4);
  for (let i = 0; i < n; i++) { A.set(PR[i].a, i * 4); Bb.set(PR[i].b, i * 4); Cc.set(PR[i].c, i * 4); D.set(PR[i].d, i * 4); }
  const G = new Float32Array(16), Gc = new Float32Array(16), Gb = new Float32Array(16);
  GR.slice(0, 4).forEach((g, i) => {
    G.set([g.material, g.bezel * CAM.s, g.refract, g.shadow * CAM.s], i * 4); Gc.set(g.color, i * 4);
    let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
    for (const p of PR) if (p.b[3] === i) { const m = p.b[1] + 60 + g.shadow * CAM.s * 2; a = Math.min(a, p.a[0] - p.a[2] - m); c = Math.max(c, p.a[0] + p.a[2] + m); b = Math.min(b, p.a[1] - p.a[3] - m); d = Math.max(d, p.a[1] + p.a[3] + m); }
    Gb.set([a, b, c, d], i * 4);
  });
  gl.useProgram(prog_);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, world);

  const k2 = clamp(spr(t - 27.5, 2.6, 0.86), 0, 1.03);
  let w = lerp(lerp(W + 180, 640, k1), d0, k2), h = lerp(lerp(W + 180, 168, k1), d0, k2);
  const cx = lerp(C, M.dot.x, k2), cy = lerp(C, M.dot.y, k2);
  return { cx, cy, w, h, r: Math.min(w, h) / 2 * k1 + 0 };
}
function sceneReturn(t, c) {
  c.fillStyle = BG; c.fillRect(0, 0, W, W);
  const s = clamp(spr(t - 28.0, 2.1, 0.55), 0, 1.3);
  if (t >= 28.0) drawWordmark(c, s, t);
  if (t < 28.25) {
    const p = pillReturn(t);
    rr(c, p.cx - p.w / 2, p.cy - p.h / 2, p.w, p.h, p.r); c.fillStyle = INK; c.fill();
  } else {
    c.beginPath(); c.arc(M.dot.x, M.dot.y, M.dotD / 2, 0, TAU); c.fillStyle = INK; c.fill();
  }
  maskText(c, 'AI 리서치 동아리 · 2026 신입 모집', C, M.base + 120, fP(600, 44), '#6b6862', 'center', vis(t, 28.5, 29.0));
}

/* =====================================================================
   FRAME
   ===================================================================== */
let lastVideoT = -1;
async function seekVideo(vt) {
  vt = clamp(vt, 0, wallVideo.duration - 0.05);
  if (Math.abs(vt - lastVideoT) < 1e-4) return;
  await new Promise(res => { wallVideo.addEventListener('seeked', res, { once: true }); wallVideo.currentTime = vt; });
  lastVideoT = vt;
}
async function seek(t) {
  t = clamp(t, 0, DUR);
  PR = []; GR = []; TOP = [];
  CAM = camera(t);
  if (t >= 24.9 && t < 27.05) await seekVideo(t - 24.9 + 0.8);
  const c = wctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = BG; c.fillRect(0, 0, W, W);
  c.setTransform(CAM.s, 0, 0, CAM.s, C - CAM.cx * CAM.s, C - CAM.cy * CAM.s);
  if (t < 8) sceneOpen(t, c);
  else if (t < 13) sceneGlass(t, c);
  else if (t < 24.3) sceneStage(t, c);
  else if (t < 27) {
    if (t >= 25.0) sceneWall(t, c); else { c.fillStyle = BG; c.fillRect(-W, -W, 3 * W, 3 * W); }
  } else sceneReturn(t, c);
  c.setTransform(1, 0, 0, 1, 0, 0);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.drawImage(world, 0, 0);
  compositeGlass();
  octx.save(); octx.setTransform(1, 0, 0, 1, 0, 0);
  for (const f of TOP) { octx.save(); f(); octx.restore(); }
  octx.restore();
  // floods (screen space)
  floods(t);
  drawCursor(t);
}
function floods(t) {
  const c = octx;
  if (t >= 24.0 && t < 25.0) {
    // the delivered circle floods the frame edge to edge, holds black for a beat
    const r0 = 75 * camera(23.99).s;
    const r = lerp(r0, 1120, eio(prog(t, 24.0, 0.3)));
    if (t < 24.3) { c.beginPath(); c.arc(C, C, r, 0, TAU); c.fillStyle = INK; c.fill(); }
    else { c.fillStyle = INK; c.fillRect(0, 0, W, W); }
    if (t < 24.3) {     // keep the check visible while it floods
      checkStroke(c, C, C + 2 * camera(23.99).s, 70 * camera(23.99).s, 1, '#fff', 7 * camera(23.99).s);
    }
  }
  if (t >= 25.0 && t < 25.6) {
    // black outside the contracting frame = the flood withdrawing
  }
  if (t >= 26.8 && t < 27.0) { c.fillStyle = INK; c.fillRect(0, 0, W, W); }
}
